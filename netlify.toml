# Netlify build settings. Netlify detects Next.js and adds its Next.js
# runtime (@netlify/plugin-nextjs) automatically, including redirects
# from next.config.ts and image optimisation.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20.9 or newer
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
